<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="/static/css/app.css">
{% include "typography.html" %}
<link rel="shortcut icon" href="/static/favicon.svg">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Recipe {{ title }}</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script>
        const recipeId = crypto.randomUUID();

        function submit_request() {
            const uuid = recipeId;
            title = document.getElementById("ftitle").value
            category = document.getElementById("fcategory").value
            ingredients = document.getElementById("fingredients").value
            steps = document.getElementById("fsteps").value
            notes = document.getElementById("fnotes").value
            if (title === "" || category === "select_category" || ingredients === "" || steps === "") {
                alert("Riempi tutti i campi obbligatori");
                return;
            }
            const recipe = {
                "prefix": "recipe",
                "id": uuid,
                "title": document.getElementById("ftitle").value,
                "category": document.getElementById("fcategory").value,
                "ingredients": document.getElementById("fingredients").value,
                "steps": document.getElementById("fsteps").value,
                "notes": document.getElementById("fnotes").value
            };

          $("#save-button").prop("disabled", true);
          $.ajax({
              url: '/api/v1/recipe/' + uuid, 
              type: 'PUT',
              contentType: "application/json; charset=utf-8",
              data: JSON.stringify(recipe),
              success: function () {
                  console.log("success");
                  window.location.replace(`./recipe/${uuid}`);
              },
              error: function (xhr, status, error) {
                alert(xhr.responseJSON?.detail || "Salvataggio non confermato. Riprova senza chiudere questa pagina.");
              },
              complete: function () {
                $("#save-button").prop("disabled", false);
              }
          });
      }

      // This function resizes a textarea to fit its content
      function autoResizeTextarea(element) {
          element.style.height = 'auto';
          element.style.height = element.scrollHeight + 'px';
      }

      // Add an event listener to each target textarea on DOM load

      document.addEventListener('DOMContentLoaded', function() {
        // Grab the textareas you want to auto-resize
        const textareas = ['ftitle', 'fingredients', 'fsteps', 'fnotes']
          .map(id => document.getElementById(id))
          .filter(Boolean);
  
        // On input, auto-resize
        textareas.forEach((ta) => {
          ta.addEventListener('input', () => autoResizeTextarea(ta));
          // Trigger an initial resize on load
          autoResizeTextarea(ta);
        });
  
        // Recalculate wrapping once the bundled font is ready.
        document.fonts.ready.then(() => {
          textareas.forEach((ta) => autoResizeTextarea(ta));
        });

        // Also, re-check sizes on window resize
        window.addEventListener('resize', () => {
          textareas.forEach((ta) => autoResizeTextarea(ta));
        });
      });
    </script>
</head>

<body>
  <div class="bg-orange-50 min-h-screen">
    <div class="container flex flex-col px-5 mx-auto xs:space-y-10 md:space-y-5 space-y-3">

      <!-- Title -->
      <textarea
        id="ftitle"
        rows="1"
        placeholder="Scrivi qui il titolo"
        class="xl:text-8xl lg:text-7xl md:text-6xl sm:text-5xl text-4xl font-serif bg-inherit focus:bg-inherit resize-none mt-10"
      ></textarea>
      
      <!-- Category -->
      <select
        id="fcategory"
        class="font-serif border text-sm rounded-lg block w-full p-2.5 "
      >
        {% for category in valid_categories %}
          <option value="{{category}}">
            {{ category }}
          </option>
          {% endfor %}
          <option value="select_category" selected>Seleziona una categoria
            </option>
      </select>

      <!-- Ingredients -->
      <p class="font-serif text-2xl sm:text-3xl md:text-4xl lg:text-5xl">Ingredienti</p>
      <textarea
        id="fingredients"
        placeholder="Scrivi qui gli ingredienti"
        class="font-serif text-lg bg-inherit focus:bg-inherit resize-none"
        rows="1"
      ></textarea>

      <!-- Steps -->
      <p class="font-serif text-2xl sm:text-3xl md:text-4xl lg:text-5xl">Ricetta</p>
      <textarea
        id="fsteps"
        placeholder="Scrivi qui la ricetta"
        class="font-serif text-lg bg-inherit focus:bg-inherit resize-none"
        rows="1"
      ></textarea>

      <!-- Notes -->
      <p class="font-serif text-2xl sm:text-3xl md:text-4xl lg:text-5xl">Note</p>
      <textarea
        id="fnotes"
        placeholder="Scrivi qui le note (opzionale)"
        class="font-serif text-lg bg-inherit focus:bg-inherit resize-none"
        rows="1"
      ></textarea>

      {% include "markdown_help.html" %}

      <br />
      <div class="page-actions">
        <button class="sm:text-lg md:text-xl lg:text-2xl hover:bg-green-500 hover:text-white border-2 border-black py-2 px-4 mx-2 font-serif rounded w-fit" id="save-button" onclick="submit_request()">
          Crea
        </button>
        <button class="sm:text-lg md:text-xl lg:text-2xl hover:bg-red-500 hover:text-white border-2 border-black py-2 px-4 mx-2 font-serif rounded w-fit" onclick="window.location.replace('./')">
          Scarta
        </button>
      </div>
    </div>
  </div>
  <div class="h-5"></div>
</body>
</html>
