<aside class="border border-black rounded-lg px-4 py-2 font-serif text-lg" aria-label="Istruzioni di formattazione">
  <p><strong>Istruzioni di formattazione</strong></p>
  <p>Elenchi puntati: inizia ogni riga con un trattino e uno spazio, ad esempio <code>- 200 g di farina</code>.</p>
  <p>Grassetto: scrivi <code>**testo**</code> per ottenere <strong>testo</strong>.</p>
  <p>Corsivo: scrivi <code>*testo*</code> per ottenere <em>testo</em>.</p>
</aside>
